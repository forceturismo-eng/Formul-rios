# Ambiente de desenvolvimento.
#
#   docker compose -f infra/docker-compose.yml up -d
#   npm run setup      # papéis do banco, migrations e seed
#   npm run dev
#
# Nenhum destes serviços está endurecido para produção. Senhas fracas e portas
# abertas no host são intencionais aqui, e é por isso que este arquivo vive em
# `infra/` e não na raiz: ninguém sobe isso por engano achando que é o deploy.

name: formularios

services:
  postgres:
    image: postgres:16-alpine
    container_name: formularios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # pt_BR para ordenação e comparação de texto se comportarem como o
      # usuário brasileiro espera (acento, maiúscula) já em desenvolvimento.
      LANG: pt_BR.UTF-8
    command:
      - postgres
      # RLS depende de o plano nunca escapar da política. Estes dois ajudam a
      # enxergar problemas de isolamento em dev, quando ainda são baratos.
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=500
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: formularios-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Storage S3-compatible. Bucket PRIVADO — nada aqui é servido diretamente ao
  # público; o acesso é sempre por URL pré-assinada com validade curta.
  minio:
    image: minio/minio:latest
    container_name: formularios-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # Cria o bucket na primeira subida e o deixa privado.
  minio-init:
    image: minio/mc:latest
    container_name: formularios-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/formularios-dev &&
        mc anonymous set none local/formularios-dev &&
        echo 'bucket formularios-dev pronto (privado)'
      "

  # Caixa de e-mail de desenvolvimento: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: formularios-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    logging:
      driver: none

  # Reverse proxy com On-Demand TLS para os domínios de clientes (seção 8.3).
  # Em desenvolvimento ele sobe mas não emite certificado — o endpoint `ask`
  # que autoriza a emissão chega na Fase 4, junto com os domínios próprios.
  caddy:
    image: caddy:2-alpine
    container_name: formularios-caddy
    restart: unless-stopped
    ports:
      - '8080:80'
      - '8443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
